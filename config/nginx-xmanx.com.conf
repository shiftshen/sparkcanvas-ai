server {
  listen 80;
  server_name xmanx.com www.xmanx.com;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://xmanx.com$request_uri;
  }
}

server {
  listen 443 ssl http2;
  server_name xmanx.com www.xmanx.com;

  ssl_certificate /etc/letsencrypt/live/xmanx.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/xmanx.com/privkey.pem;

  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 25m;

  location /api/ {
    proxy_pass http://backend:4100/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /generated/ {
    proxy_pass http://backend:4100/generated/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
