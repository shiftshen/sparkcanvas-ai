# Basic-Auth gateway for the WGOS studio. The studio's /workgraph-os API has no
# auth of its own, so this gate is what protects it on the public internet.
server {
  listen 80;
  server_name _;

  # Studio asset upload accepts up to 100mb (/workgraph-os/assets/upload).
  client_max_body_size 110m;

  auth_basic "WGOS Studio";
  auth_basic_user_file /etc/nginx/.htpasswd;

  location / {
    proxy_pass http://studio:3203;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Next.js HMR / any websocket upgrades.
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}
