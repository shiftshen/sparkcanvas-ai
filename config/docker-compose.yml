services:
  frontend:
    image: sparkcanvas-frontend:latest
    build:
      context: ../frontend
    ports:
      - "80:80"
    environment:
      - PUBLIC_URL=https://xmanx.com
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    image: sparkcanvas-backend:latest
    build:
      context: ..
      dockerfile: backend/Dockerfile
    environment:
      - NODE_ENV=production
      - PORT=4100
      - PUBLIC_URL=https://xmanx.com
      - API_BASE_URL=https://xmanx.com/api
      - YIJIARJ_BASE_URL=${YIJIARJ_BASE_URL:-https://api.yijiarj.cn/v1}
      - YIJIARJ_API_KEY=${YIJIARJ_API_KEY:-}
      - IMAGE_GEN_BASE_URL=${IMAGE_GEN_BASE_URL:-https://api.yijiarj.cn/v1}
      - IMAGE_GEN_KEY=${IMAGE_GEN_KEY:-}
      - IMAGE_GEN_MODEL=${IMAGE_GEN_MODEL:-nano_banana_2}
      - VIDEO_GEN_MODEL=${VIDEO_GEN_MODEL:-grok-imagine-1.0-video-super-720p}
      - TEXT_GEN_MODEL=${TEXT_GEN_MODEL:-gpt-5.4}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    volumes:
      - sparkcanvas_data:/app/data
    expose:
      - "4100"
    restart: unless-stopped

volumes:
  sparkcanvas_data:
