services:
  frontend:
    image: sparkcanvas-frontend:latest
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    ports:
      - "23080:80"
    environment:
      - PUBLIC_URL=https://marketing.xmanx.com
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    image: sparkcanvas-backend:latest
    build:
      context: ..
      dockerfile: backend/Dockerfile
    environment:
      - NODE_ENV=production
      - PORT=4100
      - SPARKCANVAS_AUTH_TOKEN=${SPARKCANVAS_AUTH_TOKEN:?set-a-production-auth-token}
      - SPARKCANVAS_ADMIN_ACCOUNT=${SPARKCANVAS_ADMIN_ACCOUNT:-}
      - SPARKCANVAS_ADMIN_PASSWORD=${SPARKCANVAS_ADMIN_PASSWORD:-}
      - SPARKCANVAS_DEMO_AUTH=${SPARKCANVAS_DEMO_AUTH:-false}
      - SPARKCANVAS_REGISTRATION_ENABLED=${SPARKCANVAS_REGISTRATION_ENABLED:-}
      - SPARKCANVAS_GOOGLE_CLIENT_ID=${SPARKCANVAS_GOOGLE_CLIENT_ID:-}
      - SPARKCANVAS_ALLOWED_ORIGINS=${SPARKCANVAS_ALLOWED_ORIGINS:-https://marketing.xmanx.com,https://www.marketing.xmanx.com}
      - SPARKCANVAS_PUBLIC_BASE_URL=${SPARKCANVAS_PUBLIC_BASE_URL:-https://marketing.xmanx.com}
      - SPARKCANVAS_DATA_FILE=/app/data/sparkcanvas.json
      - SPARKCANVAS_GENERATED_DIR=/app/data/generated
      - PUBLIC_URL=https://marketing.xmanx.com
      - API_BASE_URL=https://marketing.xmanx.com/api
      - YIJIARJ_BASE_URL=${YIJIARJ_BASE_URL:-https://api.yijiarj.cn/v1}
      - YIJIARJ_API_KEY=${YIJIARJ_API_KEY:-}
      - IMAGE_GEN_BASE_URL=${IMAGE_GEN_BASE_URL:-https://api.vdamo.com/v1}
      - IMAGE_GEN_KEY=${IMAGE_GEN_KEY:-}
      - IMAGE_GEN_MODEL=${IMAGE_GEN_MODEL:-gpt-image-2}
      - VIDEO_GEN_MODEL=${VIDEO_GEN_MODEL:-grok-imagine-1.0-video-super-720p}
      - TEXT_GEN_MODEL=${TEXT_GEN_MODEL:-gpt-5.4}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    volumes:
      - sparkcanvas_data:/app/data
    expose:
      - "4100"
    restart: unless-stopped

volumes:
  sparkcanvas_data:
